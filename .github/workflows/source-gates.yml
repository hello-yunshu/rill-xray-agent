name: Source Gates
on: [push, pull_request, workflow_dispatch]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - run: python3 -m pip install jsonschema
      - run: python3 scripts/run_all_checks.py
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck --exclude=SC1091 integrations/xray_bash_onekey/repository_files/scripts/*.sh
      - name: Public-history hygiene (paths + known blobs + signatures, all refs/tags)
        run: python3 scripts/verify_public_history_hygiene.py
