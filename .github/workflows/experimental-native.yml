    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@1.94.1
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets
